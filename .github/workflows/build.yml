name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.24.0
          cache: true

      - name: Generate android folder
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android --org az.adgunu --project-name adgunu .
          fi

      - name: Bump Kotlin and Gradle plugin versions
        run: |
          SETTINGS=android/settings.gradle
          SETTINGS_KTS=android/settings.gradle.kts

          if [ -f "$SETTINGS" ]; then
            sed -i "s/id \"org.jetbrains.kotlin.android\" version \"[^\"]*\"/id \"org.jetbrains.kotlin.android\" version \"1.9.22\"/" "$SETTINGS"
            sed -i "s/id 'org.jetbrains.kotlin.android' version '[^']*'/id 'org.jetbrains.kotlin.android' version '1.9.22'/" "$SETTINGS"
            if ! grep -q "org.jetbrains.kotlin.android" "$SETTINGS"; then
              sed -i "/id \"com.android.application\"/a\\        id \"org.jetbrains.kotlin.android\" version \"1.9.22\"" "$SETTINGS"
            fi
          fi

          if [ -f "$SETTINGS_KTS" ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*"/id("org.jetbrains.kotlin.android") version "1.9.22"/' "$SETTINGS_KTS"
          fi

          echo "--- settings.gradle after patch ---"
          cat "$SETTINGS" 2>/dev/null || true
          cat "$SETTINGS_KTS" 2>/dev/null || true

      - name: Force Kotlin jvmTarget and Java 17
        run: |
          APP_GRADLE=android/app/build.gradle
          APP_GRADLE_KTS=android/app/build.gradle.kts

          if [ -f "$APP_GRADLE" ]; then
            if grep -q "compileOptions" "$APP_GRADLE"; then
              sed -i "s/sourceCompatibility JavaVersion.VERSION_[0-9]*/sourceCompatibility JavaVersion.VERSION_17/" "$APP_GRADLE"
              sed -i "s/targetCompatibility JavaVersion.VERSION_[0-9]*/targetCompatibility JavaVersion.VERSION_17/" "$APP_GRADLE"
            fi
            if ! grep -q "jvmTarget" "$APP_GRADLE"; then
              sed -i "/compileOptions {/a\\        kotlinOptions { jvmTarget = '17' }" "$APP_GRADLE"
            fi
          fi

          if [ -f "$APP_GRADLE_KTS" ]; then
            sed -i 's/JavaVersion.VERSION_[0-9_]*/JavaVersion.VERSION_17/g' "$APP_GRADLE_KTS"
            if ! grep -q "jvmTarget" "$APP_GRADLE_KTS"; then
              sed -i '/compileOptions {/a\        kotlinOptions { jvmTarget = "17" }' "$APP_GRADLE_KTS"
            fi
          fi

      - name: Patch gradle.properties
        run: |
          GP=android/gradle.properties
          touch "$GP"
          if ! grep -q "android.useAndroidX" "$GP"; then
            echo "android.useAndroidX=true" >> "$GP"
          fi
          if ! grep -q "android.enableJetifier" "$GP"; then
            echo "android.enableJetifier=false" >> "$GP"
          fi
          if ! grep -q "kotlin.code.style" "$GP"; then
            echo "kotlin.code.style=official" >> "$GP"
          fi
          echo "--- gradle.properties ---"
          cat "$GP"

      - name: Flutter pub get
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: adgunu-apk
          path: build/app/outputs/flutter-apk/app-release.apk
